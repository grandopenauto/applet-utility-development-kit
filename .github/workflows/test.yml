name: Validate AUDK
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
# Pages: configured through GitHub Settings -> Pages -> main/(root).
# Generated privileged code must be reviewed before publication.
